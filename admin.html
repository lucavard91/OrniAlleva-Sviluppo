async function saveDraft(id){let draft=getDraft(id),p=draft.data,original=users.find(x=>x.user_id===id);if(!draft.dirty&&!draft.paymentReal)return modal('Nessuna modifica da salvare.');let lines=[`Account: ${nome(p)}`,`Email: ${p.email||'-'}`,`Accesso: ${accessTypeLabel(p)}`,`Scadenza: ${p.illimitato?'Nessuna':p.scadenza?dateIT(p.scadenza):'Non impostata'}`,`Pagamento: ${p.prova_gratuita?'Nessun pagamento richiesto':draft.paymentReal?'Pagato — '+Number(draft.paymentReal.importo).toFixed(2)+' €':paymentLabel(p).replace(/^[^A-Za-zÀ-ÿ]+/,'')}`];let ok=await modal('CONFERMA MODIFICA ACCOUNT\n\n'+lines.join('\n')+'\n\nControlla i dati prima del salvataggio definitivo.',true);if(!ok)return;let fields=['attivo','approvato_at','sospeso_at','illimitato','piano','scadenza','prova_gratuita','prova_gratuita_inizio','prova_gratuita_fine','stato_pagamento','importo_atteso','promemoria_pagamento','ruolo'];let payload={};for(let k of fields)if(p[k]!==undefined&&JSON.stringify(p[k])!==JSON.stringify(original[k]))payload[k]=p[k];if(Object.keys(payload).length){let {error}=await sb.from('profili_utenti').update(payload).eq('user_id',id);if(error)return modal(error.message)}if(draft.paymentReal){let v=draft.paymentReal;let {error}=await sb.rpc('ornibreed_admin_registra_pagamento',{p_user_id:id,p_importo:v.importo,p_tipo:v.tipo,p_data_pagamento:v.data,p_note:v.note});if(error)return modal(error.message)}accountDrafts.delete(id);await reload();detail(id);await modal('✅ Modifiche salvate correttamente.');}

async function openPartner(id){let p=partners.find(x=>x.id===id);if(!p)return;showPartnerPage(partnerFormHtml(p));bindPartnerForm(p);await loadPartnerEconomy(p,'all')}
function partnerPaymentModal(p){return new Promise(res=>{let d=document.createElement('div');d.className='modal';let today=new Date().toISOString().slice(0,10);d.innerHTML=`<div class="modalbox"><h3 style="margin-top:0">Registra pagamento Partner</h3><div class="small" style="margin-bottom:12px">${esc(partnerNome(p))} · ${esc(p.codice)}</div><div class="formgrid"><div class="field"><label>Importo pagato (€)</label><input autocomplete="off" id="ppAmount" inputmode="decimal" placeholder="0,00"></div><div class="field"><label>Data pagamento</label><input id="ppDate" type="date" value="${today}"></div><div class="field"><label>Nota — facoltativa</label><input autocomplete="off" id="ppNote" placeholder="Es. Bonifico, contanti…"></div></div><div class="modalactions"><button class="secondary" id="no">Annulla</button><button class="primary" id="yes">Registra</button></div></div>`;document.body.appendChild(d);d.querySelector('#no').onclick=()=>{d.remove();res(null)};d.querySelector('#yes').onclick=async()=>{let raw=d.querySelector('#ppAmount').value.trim().replace(',','.');let amount=Number(raw);if(raw===''||!Number.isFinite(amount)||amount<=0){d.querySelector('#ppAmount').focus();return}let payload={partner_id:p.id,importo:amount,valuta:'EUR',data_pagamento:d.querySelector('#ppDate').value||today,note:d.querySelector('#ppNote').value.trim()||null};let btn=d.querySelector('#yes');btn.disabled=true;let {error}=await sb.from('ornibreed_pagamenti_partner').insert(payload);if(error){btn.disabled=false;return modal('Pagamento non registrato: '+error.message)}d.remove();await loadPartnerEconomy(p,$('partnerYear')?.value||'all');await modal('✅ Pagamento Partner registrato correttamente.');res(true)}})}
async function loadPartnerEconomy(p,year='all'){let body=$('partnerEconomyBody');if(!body)return;body.innerHTML='Caricamento dati economici…';let [sumR,annualR,linksR,payR,payoutR]=await Promise.all([sb.from('ornibreed_partner_riepilogo').select('*').eq('partner_id',p.id).maybeSingle(),sb.from('ornibreed_partner_riepilogo_annuale').select('*').eq('partner_id',p.id).order('anno',{ascending:false}),sb.from('ornibreed_partner_utenti').select('user_id,created_at,codice_usato').eq('partner_id',p.id).order('created_at',{ascending:false}),sb.from('ornibreed_pagamenti').select('id,user_id,tipo,importo,data_pagamento,commissione_percentuale,commissione_importo,note').eq('partner_id',p.id).order('data_pagamento',{ascending:false}),sb.from('ornibreed_pagamenti_partner').select('id,importo,data_pagamento,note').eq('partner_id',p.id).order('data_pagamento',{ascending:false})]);let err=[sumR.error,annualR.error,linksR.error,payR.error,payoutR.error].find(Boolean);if(err){body.innerHTML=`<div class="badge bad">Errore caricamento dati economici: ${esc(err.message)}</div>`;return}let summary=sumR.data||{},annual=annualR.data||[],links=linksR.data||[],payments=payR.data||[],payouts=payoutR.data||[];let yearSel=$('partnerYear');if(yearSel){let current=String(year||'all');let years=[...new Set([...annual.map(x=>x.anno),...payments.map(x=>String(x.data_pagamento||'').slice(0,4)),...payouts.map(x=>String(x.data_pagamento||'').slice(0,4))].filter(Boolean))].sort((a,b)=>Number(b)-Number(a));yearSel.innerHTML='<option value="all">Tutti gli anni</option>'+years.map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join('');yearSel.value=years.map(String).includes(current)?current:'all';year=yearSel.value}let fp=year==='all'?payments:payments.filter(x=>String(x.data_pagamento||'').startsWith(year+'-'));let fo=year==='all'?payouts:payouts.filter(x=>String(x.data_pagamento||'').startsWith(year+'-'));let inc=year==='all'?Number(summary.incassi_generati||0):fp.reduce((a,x)=>a+Number(x.importo||0),0);let earned=year==='all'?Number(summary.commissioni_guadagnate||0):fp.reduce((a,x)=>a+Number(x.commissione_importo||0),0);let paid=year==='all'?Number(summary.gia_pagato||0):fo.reduce((a,x)=>a+Number(x.importo||0),0);let remain=year==='all'?Number(summary.resta_da_pagare||0):earned-paid;let payingUsers=new Set(payments.filter(x=>Number(x.importo)>0).map(x=>x.user_id));let linkedUsers=links.map(l=>users.find(u=>u.user_id===l.user_id)).filter(Boolean);let activeUsers=linkedUsers.filter(u=>u.attivo).length;body.innerHTML=`<div class="partner-econ-grid"><div class="partner-econ-stat"><small>Utenti portati</small><b>${Number(summary.utenti_portati||links.length)}</b></div><div class="partner-econ-stat"><small>Utenti attivi</small><b>${activeUsers}</b></div><div class="partner-econ-stat"><small>Utenti paganti</small><b>${payingUsers.size}</b></div><div class="partner-econ-stat"><small>Incassi generati</small><b>${euro(inc)}</b></div><div class="partner-econ-stat"><small>Commissioni guadagnate</small><b>${euro(earned)}</b></div><div class="partner-econ-stat"><small>Già pagato</small><b>${euro(paid)}</b></div><div class="partner-econ-stat due"><small>Resta da pagare</small><b>${euro(remain)}</b></div><div class="partner-econ-stat"><small>Commissione concordata</small><b>${Number(p.commissione_percentuale||0).toFixed(2).replace('.',',')}%</b></div><div class="partner-econ-stat"><small>Rinnovi</small><b>${p.commissione_rinnovi?'Inclusi':'Esclusi'}</b></div></div><div class="partner-section"><h3 style="margin:0 0 8px">Utenti portati</h3>${partnerUsersTable(links,payments)}</div><div class="partner-section"><h3 style="margin:0 0 8px">Pagamenti utenti ${year==='all'?'':'· '+esc(year)}</h3>${partnerPaymentsTable(fp)}</div><div class="partner-section"><h3 style="margin:0 0 8px">Storico pagamenti al Partner ${year==='all'?'':'· '+esc(year)}</h3>${partnerPayoutsTable(fo)}</div>`}
function partnerUsersTable(links,payments){if(!links.length)return '<div class="small">Nessun utente attribuito a questo Partner.</div>';return `<div style="overflow:auto"><table class="partner-table"><thead><tr><th>Utente</th><th>Registrato</th><th>Pagamenti</th><th>Totale</th></tr></thead><tbody>${links.map(l=>{let u=users.find(x=>x.user_id===l.user_id),pp=payments.filter(x=>x.user_id===l.user_id),tot=pp.reduce((a,x)=>a+Number(x.importo||0),0);return `<tr><td><b>${esc(u?nome(u):l.user_id)}</b><br><small>${esc(u?.email||'')}</small></td><td>${dateIT(String(l.created_at||'').slice(0,10))}</td><td>${pp.length}</td><td>${euro(tot)}</td></tr>`}).join('')}</tbody></table></div>`}
function partnerPaymentsTable(rows){if(!rows.length)return '<div class="small">Nessun pagamento utente nel periodo selezionato.</div>';return `<div style="overflow:auto"><table class="partner-table"><thead><tr><th>Data</th><th>Utente</th><th>Tipo</th><th>Incasso</th><th>Commissione</th></tr></thead><tbody>${rows.map(x=>{let u=users.find(v=>v.user_id===x.user_id);return `<tr><td>${dateIT(x.data_pagamento)}</td><td>${esc(u?nome(u):x.user_id||'-')}</td><td>${esc(x.tipo||'-')}</td><td>${euro(x.importo)}</td><td>${euro(x.commissione_importo)}${x.commissione_percentuale!=null?`<br><small>${Number(x.commissione_percentuale).toFixed(2).replace('.',',')}%</small>`:''}</td></tr>`}).join('')}</tbody></table></div>`}
function partnerPayoutsTable(rows){if(!rows.length)return '<div class="small">Nessun pagamento al Partner nel periodo selezionato.</div>';return `<div style="overflow:auto"><table class="partner-table"><thead><tr><th>Data</th><th>Importo</th><th>Nota</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${dateIT(x.data_pagamento)}</td><td><b>${euro(x.importo)}</b></td><td>${esc(x.note||'-')}</td></tr>`).join('')}</tbody></table></div>`}
function newPartner(){showPartnerPage(partnerFormHtml({commissione_percentuale:0,commissione_rinnovi:true,attivo:true,tipo:'associazione'}));bindPartnerForm({})}
async function generaCodicePartner(){let {data,error}=await sb.rpc('ornibreed_genera_codice_partner');if(error)throw error;if(!data)throw new Error('Codice Partner non generato');return String(data).toUpperCase()}
function readPartnerPayload(){let nomeV=$('ptNome').value.trim(),commissione=Number(String($('ptCommissione').value).replace(',','.'));if(!nomeV)throw new Error('Inserisci il nome del Partner / Associazione.');if(!Number.isFinite(commissione)||commissione<0||commissione>100)throw new Error('La commissione deve essere compresa tra 0 e 100.');return {nome:nomeV,referente:$('ptReferente').value.trim()||null,tipo:$('ptTipo').value,commissione_percentuale:commissione,commissione_rinnovi:$('ptRinnovi').value==='true',telefono:$('ptTelefono').value.trim()||null,email:$('ptEmail').value.trim()||null,note:$('ptNote').value.trim()||null,attivo:$('ptAttivo').value==='true'}}
async function savePartner(id){let payload;try{payload=readPartnerPayload()}catch(e){return modal(e.message)}if(id){let {error}=await sb.from('ornibreed_partner').update(payload).eq('id',id);if(error)return modal(error.message);await loadPartners();closePartnerPage();await modal('✅ Partner aggiornato correttamente.');return}let created=null,lastError=null;for(let i=0;i<8;i++){try{payload.codice=await generaCodicePartner()}catch(e){return modal(e.message)}let {data,error}=await sb.from('ornibreed_partner').insert(payload).select('*').single();if(!error){created=data;break}lastError=error;if(String(error.code)!=='23505')break}if(!created)return modal(`Partner non creato.\n\n${lastError?.message||'Impossibile generare un codice univoco.'}`);await loadPartners();closePartnerPage();await modal(`✅ Partner creato correttamente.\n\nCodice Partner: ${created.codice}\n\nIl codice è univoco e resta associato a questo Partner.`)}
function partnerReferralLink(p){return `${location.origin}${location.pathname.replace(/admin[^/]*$/i,'index.html')}?ref=${encodeURIComponent(p.codice)}`}
async function copyText(v,msg){try{await navigator.clipboard.writeText(String(v));await modal('✅ '+msg)}catch(e){let val=await modal('Copia manualmente questo valore:\n\n'+String(v),false,true);}}
async function deletePartner(p){let ok=await modal(`⚠️ ELIMINAZIONE DEFINITIVA PARTNER\n\nStai per eliminare ${partnerNome(p)} (${p.codice}).\n\nIl Partner sparirà definitivamente dalla lista. Se il database rileva collegamenti storici che non possono essere rimossi, l'operazione verrà bloccata per proteggere contabilità e commissioni.`,true);if(!ok)return;let parola=await modal('Seconda conferma di sicurezza.\n\nScrivi esattamente ELIMINA per procedere.',false,true);if(parola===null)return;if(String(parola).trim().toUpperCase()!=='ELIMINA')return modal('Operazione annullata: la parola di conferma non corrisponde.');let {error}=await sb.from('ornibreed_partner').delete().eq('id',p.id);if(error)return modal(`❌ Partner non eliminato.\n\n${error.message}\n\nSe esiste già uno storico collegato, va prima predisposta la conservazione contabile lato database.`);await loadPartners();closePartnerPage();await modal('✅ Partner eliminato definitivamente.');}
function openPartnerWhatsapp(p){let tel=partnerTelefonoLink(p.telefono);if(!tel)return modal('Numero WhatsApp non disponibile.');let link=partnerReferralLink(p);let msg=`Ciao ${p.referente||''}, sei stato registrato come Partner OrniBreed Manager.\n\nIl tuo codice Partner personale è ${p.codice}.\n\nPer registrarti su OrniBreed, apri direttamente questo link:\n${link}\n\nIl codice Partner verrà inserito automaticamente nella registrazione.`;window.open(`https://wa.me/${encodeURIComponent(tel)}?text=${encodeURIComponent(msg)}`,'_blank','noopener')}

$('searchBtn').onclick=()=>{let q=$('search').value.trim();openAccountListPage({queryValue:q,title:q?`Risultati ricerca: ${q}`:'Account totali',subtitle:'Risultati mostrati in una pagina interna dedicata.'})};$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){$('searchBtn').click()}});$('refresh').onclick=reload;$('newPartner').onclick=newPartner;$('openPartnerList').onclick=openPartnerListPage;load();
</script><script>document.addEventListener("DOMContentLoaded",()=>{document.querySelectorAll("form").forEach(f=>f.setAttribute("autocomplete","off"));document.querySelectorAll("input:not([type=password]),textarea").forEach(el=>{el.setAttribute("autocomplete","off");el.setAttribute("autocorrect","off");el.setAttribute("autocapitalize","off");el.setAttribute("spellcheck","false")})});</script></body></html>
