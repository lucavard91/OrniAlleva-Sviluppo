<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnosi avvio OrniAlleva Sviluppo</title><style>body{font:16px -apple-system,Arial,sans-serif;background:#f3f7f4;color:#163c2c;padding:16px;margin:0}h1{font-size:20px}#log{white-space:pre-wrap;background:white;border:1px solid #bccfc3;padding:14px;border-radius:10px;min-height:140px;overflow-wrap:anywhere}iframe{width:100%;height:280px;border:1px solid #bbb;background:white;margin-top:12px}button{padding:12px;border-radius:8px;border:0;background:#174c35;color:white;font-size:16px}small{display:block;margin-top:10px}</style></head><body><h1>Diagnosi OrniAlleva Sviluppo</h1><p>Questa pagina controlla l'avvio senza modificare l'applicazione né il database.</p><button id="run">Ripeti controllo</button><pre id="log">Preparazione…</pre><iframe id="preview" title="Anteprima diagnostica"></iframe><small>Se compaiono errori, invia uno screenshot del riquadro bianco qui sopra. Non inserire credenziali nell'anteprima.</small><script>
const log=document.getElementById('log');let events=[];
function add(t){events.push(t);log.textContent=events.join('\n');}
window.addEventListener('message',e=>{if(e.source!==document.getElementById('preview').contentWindow||!e.data||e.data.tag!=='obdiag')return;add(e.data.msg);});
async function run(){events=[];add('1. Caricamento HTML dalla rete…');let html;try{const r=await fetch('./index.html?ob_diagnosi='+Date.now(),{cache:'no-store'});add('HTTP: '+r.status+'; bytes: '+(await r.clone().text()).length);if(!r.ok)throw Error('HTTP '+r.status);html=await r.text();}catch(e){add('ERRORE FETCH: '+e.message);return;}
const hook=`<script>(function(){function send(s){try{parent.postMessage({tag:'obdiag',msg:s},'*')}catch(e){}};window.addEventListener('error',function(e){send('ERRORE JS: '+String(e.message).slice(0,180)+' | linea '+e.lineno+' col '+e.colno)},true);window.addEventListener('unhandledrejection',function(e){send('PROMISE: '+String(e.reason&&e.reason.message||e.reason).slice(0,180))});document.addEventListener('DOMContentLoaded',function(){send('DOMContentLoaded; login='+!!document.getElementById('loginScreen')+'; intro='+!!document.getElementById('v255BrandIntro'));setTimeout(function(){let l=document.getElementById('loginScreen'),i=document.getElementById('v255BrandIntro');send('Dopo 7s: login='+(l?getComputedStyle(l).display:'assente')+'; intro='+(i?getComputedStyle(i).display+' / '+getComputedStyle(i).visibility:'rimossa')+'; supabase='+!!window.supabase)},7000)});send('Hook diagnostico avviato');})();<\/script>`;
html=html.replace(/<head[^>]*>/i,m=>m+'<base href="'+new URL('./',location.href).href+'">'+hook);
add('2. Esecuzione nell’anteprima; attendi 8 secondi…');
document.getElementById('preview').srcdoc=html;
}
document.getElementById('run').onclick=run;run();
</script></body></html>
